# Apache prefork + mod_php, sized for live evaluations with 300+ students at once.
# Why these numbers: see docs/PERFORMANCE.md (measured with tests/load/).

# A prefork worker is a whole PHP process. With KeepAlive on, every connected browser keeps one worker even while idle:
# with the stock 5 s keep-alive, 150 students freeze the rest of the room; with 1 s, every request still pins a worker for
# an extra second (about 190 workers for 300 students). Switching it off makes workers free up the moment a response is sent.
# The price is one TCP connection per request, cheap on the server.
KeepAlive Off

<IfModule mpm_prefork_module>
    # Start the pool in advance: Apache forks new workers only gradually, which delays the first wave of arrivals.
    StartServers             60
    MinSpareServers          40
    MaxSpareServers         120
    ServerLimit             600
    MaxRequestWorkers       600
    # Recycle workers now and then so a leak in any script cannot grow forever
    MaxConnectionsPerChild   5000
</IfModule>

# Slow clients should not hold a worker for a minute
Timeout 30
RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
