; Loaded by the Dockerfile. Opcache keeps compiled PHP in memory: the biggest single CPU saving for this app.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Set to 1 on a server where you edit files in place (checks for changes every 2 s); 0 is fastest when you deploy by rebuilding.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Each connected student has a session file; keep them off the slowest disk and let PHP clean up
session.gc_probability=1
session.gc_divisor=200
session.gc_maxlifetime=14400

display_errors=Off
log_errors=On

; Uploads: a zip of questions and pictures can reach several hundred MB. post_max_size must be larger than upload_max_filesize.
upload_max_filesize=512M
post_max_size=640M
max_file_uploads=100
memory_limit=512M
max_execution_time=600
max_input_time=600
